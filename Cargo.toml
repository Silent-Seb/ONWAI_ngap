[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
authors = ["ONWAI_ngap contributors"]
publish = false
repository = "https://github.com/Silent-Seb/ONWAI_ngap"
keywords = ["ngap", "5g", "3gpp", "asn1", "per"]
categories = ["parser-implementations", "encoding", "network-programming"]

[workspace.dependencies]
# generator / tooling
anyhow = "1"
clap = { version = "4", features = ["derive"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.10"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
